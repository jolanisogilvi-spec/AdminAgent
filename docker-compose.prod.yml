name: adminagent_prod

services:
  postgres:
    image: postgres:15-alpine
    container_name: admin_agent_postgres_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-admin_agent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - admin_agent_network

  redis:
    image: redis:7-alpine
    container_name: admin_agent_redis_prod
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - admin_agent_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: admin_agent_backend_prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-admin_agent}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ADMIN_INITIAL_USERNAME: ${ADMIN_INITIAL_USERNAME:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-admin123}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
    volumes:
      - backend_chroma_data:/app/chroma_data
    expose:
      - "8030"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - admin_agent_network

  frontend-nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: admin_agent_frontend_prod
    ports:
      - "${WEB_PORT:-8030}:80"
    depends_on:
      - backend
    networks:
      - admin_agent_network

volumes:
  postgres_data:
  redis_data:
  backend_chroma_data:

networks:
  admin_agent_network:
    driver: bridge
