global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'admin-agent'
    environment: 'production'

# Alertmanager 配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# 告警规则文件
rule_files:
  - 'alerts.yml'

# 抓取配置
scrape_configs:
  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # FastAPI 后端应用
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:8030']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Node Exporter 系统指标
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # PostgreSQL 数据库
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  # Redis 缓存
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  # Docker 容器自动发现
  - job_name: 'docker'
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
    relabel_configs:
      - source_labels: [__meta_docker_container_label_prometheus_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_docker_container_label_prometheus_port]
        action: replace
        target_label: __address__
        regex: (.*)
        replacement: $1
      - source_labels: [__meta_docker_container_label_prometheus_path]
        action: replace
        target_label: __metrics_path__
        regex: (.*)
        replacement: $1
      - source_labels: [__meta_docker_container_name]
        action: replace
        target_label: container_name
